
<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>ZAYRO AI</title>

<style>
:root {
  color-scheme: dark;
  --bg:#0b1020;
  --side:#0e1729;
  --panel:#121e32;
  --panel2:#192943;
  --line:#283b57;
  --txt:#edf4ff;
  --muted:#91a4bf;
  --blue:#66c5ff;
  --danger:#ff7777;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--txt);
  font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  min-height:100vh;
}

button,textarea { font:inherit; }
button { -webkit-tap-highlight-color:transparent; }

.app { display:flex; min-height:100vh; }

.side {
  width:265px;
  flex-shrink:0;
  background:var(--side);
  border-right:1px solid var(--line);
  padding:20px 15px;
  display:flex;
  flex-direction:column;
  gap:20px;
  z-index:20;
}

.brand {
  display:flex;
  align-items:center;
  gap:11px;
  padding:5px 7px;
}

.logo {
  width:40px;
  height:40px;
  border-radius:13px;
  background:linear-gradient(135deg,#a6eaff,#347ce7);
  display:grid;
  place-items:center;
  color:#08152a;
  font-weight:950;
  font-size:21px;
}

.brand strong { letter-spacing:2px; font-size:18px; }

.brand small {
  display:block;
  color:var(--muted);
  font-size:9px;
  letter-spacing:1.7px;
  margin-top:2px;
}

.new {
  padding:12px;
  border:1px solid #36547a;
  background:#172a45;
  color:var(--txt);
  border-radius:12px;
  text-align:left;
  cursor:pointer;
}

.new:hover,.suggestion:hover { background:#203957; }

.side-label {
  font-size:10px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:#7186a5;
  padding:0 8px;
  margin-bottom:9px;
}

.history {
  display:flex;
  flex-direction:column;
  gap:5px;
  overflow-y:auto;
  max-height:55vh;
}

.history-empty {
  color:var(--muted);
  font-size:12px;
  padding:10px 8px;
}

.history-item {
  display:flex;
  align-items:center;
  gap:4px;
  border-radius:9px;
}

.history-open {
  flex:1;
  min-width:0;
  border:0;
  background:transparent;
  color:#b8c7dc;
  text-align:left;
  padding:10px;
  border-radius:9px;
  cursor:pointer;
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.history-open.active,.history-open:hover {
  background:var(--panel2);
  color:white;
}

.delete-chat {
  border:0;
  background:transparent;
  color:#7186a5;
  padding:8px;
  border-radius:8px;
  cursor:pointer;
}

.delete-chat:hover {
  color:var(--danger);
  background:#30202b;
}

.sidefoot {
  margin-top:auto;
  border-top:1px solid var(--line);
  padding:14px 8px;
  color:#7186a5;
  font-size:11px;
  line-height:1.7;
}

.main {
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

.top {
  height:62px;
  flex-shrink:0;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:0 25px;
}

.top span { color:#a9bad2; font-size:13px; }

.online {
  color:#94dfb7!important;
  border:1px solid #28533e;
  background:#10291f;
  padding:6px 9px;
  border-radius:20px;
  white-space:nowrap;
  font-size:11px!important;
}

.menu-btn {
  display:none;
  border:1px solid var(--line);
  background:var(--panel);
  color:white;
  border-radius:10px;
  padding:8px 11px;
  cursor:pointer;
}

.mobile-brand {
  display:none;
  font-weight:850;
  letter-spacing:1.5px;
}

.content {
  width:min(850px,100%);
  margin:auto;
  flex:1;
  display:flex;
  flex-direction:column;
  padding:25px 22px 17px;
}

.welcome {
  text-align:center;
  margin:auto 0 25px;
}

.orb {
  width:65px;
  height:65px;
  margin:0 auto 18px;
  border-radius:22px;
  background:radial-gradient(circle at 30% 25%,#c5f0ff,#559ef0 50%,#254b9b);
  display:grid;
  place-items:center;
  color:#08162d;
  font-weight:950;
  font-size:30px;
  box-shadow:0 0 35px #347de522;
}

.welcome h1 {
  font-size:clamp(29px,5vw,43px);
  margin:0 0 9px;
}

.welcome h1 em {
  font-style:normal;
  color:var(--blue);
}

.welcome p {
  color:var(--muted);
  font-size:14px;
}

.suggestions {
  width:min(620px,100%);
  margin:24px auto 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.suggestion {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:13px;
  color:#dce9f8;
  text-align:left;
  padding:14px;
  cursor:pointer;
  font-size:13px;
  transition:.2s;
}

.suggestion small {
  display:block;
  color:var(--muted);
  margin-top:5px;
}

.messages {
  display:flex;
  flex-direction:column;
  gap:21px;
  margin:0 0 18px;
}

.msg {
  display:flex;
  gap:11px;
  align-items:flex-start;
  animation:appear .2s ease;
}

@keyframes appear {
  from { opacity:0; transform:translateY(5px); }
  to { opacity:1; transform:translateY(0); }
}

.avatar {
  width:30px;
  height:30px;
  flex:0 0 30px;
  border-radius:10px;
  background:#1a3455;
  color:var(--blue);
  display:grid;
  place-items:center;
  font-size:11px;
  font-weight:800;
}

.msg.user { flex-direction:row-reverse; }

.bubble {
  font-size:14px;
  line-height:1.7;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  padding-top:3px;
  min-width:0;
}

.msg.user .bubble {
  max-width:82%;
  background:#172a45;
  border:1px solid #294363;
  border-radius:14px;
  padding:10px 13px;
}

.msg.error .bubble { color:#ff9999; }

.typing {
  color:var(--muted);
  font-size:13px;
  padding:5px 0;
}

.composer-wrap { margin-top:auto; }

.composer {
  display:flex;
  align-items:flex-end;
  gap:9px;
  background:var(--panel);
  border:1px solid #304560;
  border-radius:17px;
  padding:9px;
  transition:border-color .2s;
}

.composer:focus-within { border-color:#559ef0; }

.composer textarea {
  flex:1;
  min-width:0;
  min-height:42px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:var(--txt);
  font:inherit;
  font-size:14px;
  padding:11px 8px;
}

.send {
  width:42px;
  height:42px;
  flex-shrink:0;
  border:0;
  border-radius:12px;
  background:linear-gradient(135deg,#72d0ff,#347de5);
  color:#07162c;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
}

.send:disabled { opacity:.45; cursor:not-allowed; }

.note {
  text-align:center;
  color:#71839d;
  font-size:10px;
  margin:9px;
}

.backdrop {
  display:none;
}

@media(max-width:700px) {
  .side {
    display:flex;
    position:fixed;
    top:0;
    bottom:0;
    left:0;
    width:min(290px,85vw);
    transform:translateX(-105%);
    transition:transform .25s ease;
    box-shadow:15px 0 40px #0008;
  }

  .side.open { transform:translateX(0); }

  .backdrop.show {
    display:block;
    position:fixed;
    inset:0;
    background:#0009;
    z-index:15;
  }

  .top {
    height:56px;
    padding:0 12px;
    gap:9px;
  }

  .menu-btn { display:block; }

  .mobile-brand {
    display:block;
    font-size:13px;
  }

  .top span { font-size:11px; }

  .content { padding:20px 13px 14px; }

  .suggestions { grid-template-columns:1fr; }

  .suggestion:nth-child(n+4) { display:none; }

  .welcome { margin:auto 0 22px; }

  .msg.user .bubble { max-width:88%; }

  .messages { gap:17px; }
}
</style>
</head>

<body>
<div class="app">

<aside class="side" id="sidebar">
  <div class="brand">
    <div class="logo">Z</div>
    <div>
      <strong>ZAYRO</strong>
      <small>ARTIFICIAL INTELLIGENCE</small>
    </div>
  </div>

  <button class="new" id="newChat">＋ Bisedë e re</button>

  <div>
    <div class="side-label">Bisedat e tua</div>
    <div class="history" id="history"></div>
  </div>

  <div class="sidefoot">
    ZAYRO AI · Versioni i përmirësuar<br>
    Bisedat ruhen në këtë pajisje.
  </div>
</aside>

<div class="backdrop" id="backdrop"></div>

<main class="main">

  <header class="top">
    <button class="menu-btn" id="menuBtn" aria-label="Hap historikun">☰</button>
    <div class="mobile-brand">ZAYRO AI</div>
    <span>Asistenti yt inteligjent</span>
    <span class="online">● Gati</span>
  </header>

  <section class="content">

    <div class="welcome" id="welcome">
      <div class="orb">Z</div>
      <h1>Mirë se vjen te <em>ZAYRO</em></h1>
      <p>Çfarë dëshiron të eksplorojmë sot?</p>

      <div class="suggestions">
        <button class="suggestion" data-prompt="Ma shpjego një temë të vështirë me fjalë të thjeshta.">
          ✦ Shpjego diçka
          <small>Kupto tema të reja</small>
        </button>

        <button class="suggestion" data-prompt="Më ndihmo të gjej një ide kreative për projekt.">
          ✧ Gjej një ide
          <small>Krijo diçka të re</small>
        </button>

        <button class="suggestion" data-prompt="Më ndihmo të shkruaj një mesazh profesional.">
          ▤ Shkruaj diçka
          <small>Tekste dhe mesazhe</small>
        </button>

        <button class="suggestion" data-prompt="Më mëso një aftësi të re hap pas hapi.">
          ⌘ Mëso diçka
          <small>Hap pas hapi</small>
        </button>
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="composer-wrap">
      <form class="composer" id="form">
        <textarea
          id="prompt"
          rows="1"
          placeholder="Shkruaji ZAYRO-s..."
          aria-label="Shkruaj mesazhin"
        ></textarea>
        <button class="send" id="send" type="submit" aria-label="Dërgo">↑</button>
      </form>
      <div class="note" id="note">ZAYRO AI · Asistenti yt</div>
    </div>

  </section>
</main>
</div>

<script>
const $ = selector => document.querySelector(selector);

const form = $('#form');
const input = $('#prompt');
const messages = $('#messages');
const welcome = $('#welcome');
const send = $('#send');
const historyEl = $('#history');
const note = $('#note');
const sidebar = $('#sidebar');
const backdrop = $('#backdrop');

const STORAGE_KEY = 'zayro_chats';

let chats = loadChats();
let activeId = null;

function loadChats() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    return Array.isArray(saved)
      ? saved.filter(c =>
          c &&
          typeof c.id === 'string' &&
          typeof c.title === 'string' &&
          Array.isArray(c.messages)
        )
      : [];
  } catch {
    return [];
  }
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
    return true;
  } catch (error) {
    note.textContent = 'Nuk u ruajt biseda në këtë pajisje.';
    return false;
  }
}

function current() {
  return chats.find(c => c.id === activeId);
}

function closeSidebar() {
  sidebar.classList.remove('open');
  backdrop.classList.remove('show');
}

function openSidebar() {
  sidebar.classList.add('open');
  backdrop.classList.add('show');
}

function scrollBottom() {
  window.scrollTo({
    top: document.body.scrollHeight,
    behavior: 'smooth'
  });
}

function renderHistory() {
  historyEl.replaceChildren();

  if (!chats.length) {
    const empty = document.createElement('div');
    empty.className = 'history-empty';
    empty.textContent = 'Bisedat e tua shfaqen këtu.';
    historyEl.append(empty);
    return;
  }

  chats.slice().reverse().forEach(chat => {
    const item = document.createElement('div');
    item.className = 'history-item';

    const open = document.createElement('button');
    open.className = 'history-open';
    open.textContent = chat.title;
    open.title = chat.title;

    if (chat.id === activeId) {
      open.classList.add('active');
    }

    open.onclick = () => openChat(chat.id);

    const del = document.createElement('button');
    del.className = 'delete-chat';
    del.textContent = '×';
    del.title = 'Fshi bisedën';
    del.setAttribute('aria-label', 'Fshi bisedën');

    del.onclick = event => {
      event.stopPropagation();

      if (!confirm('A dëshiron ta fshish këtë bisedë?')) return;

      chats = chats.filter(c => c.id !== chat.id);

      if (activeId === chat.id) {
        activeId = null;
        messages.replaceChildren();
        welcome.style.display = 'block';
      }

      save();
      renderHistory();
      closeSidebar();
    };

    item.append(open, del);
    historyEl.append(item);
  });
}

function addMsg(text, role) {
  const row = document.createElement('div');
  row.className = 'msg ' + (role === 'user' ? 'user' : 'assistant');

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? 'TI' : 'Z';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  row.append(avatar, bubble);
  messages.append(row);

  return row;
}

function showError(text) {
  const row = addMsg('Gabim: ' + text, 'assistant');
  row.classList.add('error');
  scrollBottom();
}

function openChat(id) {
  const chat = chats.find(c => c.id === id);
  if (!chat) return;

  activeId = id;
  messages.replaceChildren();
  welcome.style.display = 'none';

  chat.messages.forEach(message => {
    if (message && typeof message.text === 'string') {
      addMsg(message.text, message.role);
    }
  });

  renderHistory();
  closeSidebar();
  scrollBottom();
}

function newChat() {
  activeId = null;
  messages.replaceChildren();
  welcome.style.display = 'block';
  input.value = '';
  input.style.height = '42px';
  renderHistory();
  closeSidebar();
  input.focus();
}

function makeChat(text) {
  const chat = {
    id: Date.now().toString() + Math.random().toString(36).slice(2, 7),
    title: text.slice(0, 38),
    messages: []
  };

  chats.push(chat);
  activeId = chat.id;
  return chat;
}

async function submit(text) {
  const value = (text ?? input.value).trim();

  if (!value || send.disabled) return;

  const chat = current() || makeChat(value);

  chat.messages.push({
    role: 'user',
    text: value
  });

  if (chat.messages.length === 1) {
    chat.title = value.slice(0, 38);
  }

  save();
  renderHistory();

  welcome.style.display = 'none';

  if (activeId === chat.id) {
    addMsg(value, 'user');
  }

  input.value = '';
  input.style.height = '42px';

  send.disabled = true;

  const wait = document.createElement('div');
  wait.className = 'typing';
  wait.textContent = 'ZAYRO po mendon…';

  if (activeId === chat.id) {
    messages.append(wait);
    scrollBottom();
  }

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        messages: chat.messages.slice(-20)
      })
    });

    const raw = await response.text();

    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error(
        'Serveri nuk ktheu JSON të vlefshëm. HTTP ' + response.status
      );
    }

    if (!response.ok) {
      throw new Error(
        data.error || 'Kërkesa dështoi. HTTP ' + response.status
      );
    }

    const answer = data.reply || 'Nuk mora përgjigje.';

    chat.messages.push({
      role: 'assistant',
      text: answer
    });

    save();

    if (activeId === chat.id) {
      addMsg(answer, 'assistant');
    }

    note.textContent = 'ZAYRO AI · Asistenti yt';

  } catch (error) {
    const message = error?.message || 'Gabim i panjohur.';

    if (activeId === chat.id) {
      showError(message);
    }

    note.textContent = 'Pati një problem gjatë kërkesës.';

  } finally {
    wait.remove();
    send.disabled = false;
    renderHistory();

    if (activeId === chat.id) {
      scrollBottom();
    }

    input.focus();
  }
}

form.addEventListener('submit', event => {
  event.preventDefault();
  submit();
});

input.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    submit();
  }
});

input.addEventListener('input', () => {
  input.style.height = '42px';
  input.style.height = Math.min(input.scrollHeight, 150) + 'px';
});

$('#newChat').onclick = newChat;
$('#menuBtn').onclick = openSidebar;
backdrop.onclick = closeSidebar;

document.querySelectorAll('[data-prompt]').forEach(button => {
  button.onclick = () => submit(button.dataset.prompt);
});

renderHistory();
</script>
</body>
</html>
